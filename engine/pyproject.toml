[project]
name = "mitos"
version = "0.1.0"
description = "Dependabot for copied, vendored, and AI-derived code that package managers cannot see."
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
]

[project.scripts]
mitos = "mitos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mitos"]
